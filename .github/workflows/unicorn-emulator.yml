name: Unicorn MIPS emulator smoke tests
on:
  push:
    branches: [unicorn-mips-emulator]
  pull_request:
    paths:
      - 'tools/arcade_emulator.py'
      - 'tools/simulator_audio.py'
      - 'test/arcade_mips.py'
      - 'patch/arcade_core.*'
      - '.github/workflows/unicorn-emulator.yml'
jobs:
  mips-and-render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MIPS and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld binutils python3-tk
          python3 -m pip install --break-system-packages -r requirements-simulator.txt
      - name: Check Python syntax
        run: python3 -m py_compile tools/arcade_emulator.py tools/simulator.py tools/simulator_audio.py test/arcade_mips.py
      - name: Execute actual Q2-target MIPS instructions
        run: python3 test/arcade_mips.py --self-test
      - name: Render interactive emulator game screens headlessly
        run: |
          python3 tools/arcade_emulator.py --snapshot /tmp/q2-pong.png --game pong
          python3 tools/arcade_emulator.py --snapshot /tmp/q2-blocks.png --game blocks
          python3 -c 'from PIL import Image; import sys; assert all(Image.open(p).size == (435, 664) for p in sys.argv[1:])' /tmp/q2-pong.png /tmp/q2-blocks.png
      - uses: actions/upload-artifact@v4
        with:
          name: q2-unicorn-screenshots
          path: |
            /tmp/q2-pong.png
            /tmp/q2-blocks.png
