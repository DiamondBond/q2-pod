name: Arcade core tests
on:
  push:
    branches: [builtin-pong-tetris, builtin-breakout]
  pull_request:
    paths:
      - 'patch/arcade_core.*'
      - 'patch/breakout_core.*'
      - 'test/breakout_core*'
      - 'patch/game_framework.*'
      - 'test/arcade_core*'
      - 'test/game_framework*'
      - 'test/arcade_mips.py'
      - 'patch/arcade_gameplay.inc'
      - 'patch/arcade_draw.inc'
      - 'patch/games.c'
      - 'tools/peq.py'
      - 'patch/peq.h'
      - '.github/workflows/arcade.yml'
jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run portable arcade tests
        run: sh test/arcade_core.sh
      - name: Run Breakout game core tests
        run: sh test/breakout_core.sh
      - name: Run game framework tests
        run: sh test/game_framework.sh
      - name: Run undefined behavior sanitizer checks
        run: |
          cc -std=c11 -O1 -g -fsanitize=undefined -fno-omit-frame-pointer -Wall -Wextra -Werror -pedantic patch/arcade_core.c test/arcade_core_test.c -o /tmp/q2-arcade-ubsan
          /tmp/q2-arcade-ubsan
          cc -std=c11 -O1 -g -fsanitize=undefined -fno-omit-frame-pointer -Wall -Wextra -Werror -pedantic patch/breakout_core.c test/breakout_core_test.c -o /tmp/q2-breakout-ubsan
          /tmp/q2-breakout-ubsan
          cc -std=c11 -O1 -g -fsanitize=undefined -fno-omit-frame-pointer -Wall -Wextra -Werror -pedantic patch/game_framework.c test/game_framework_test.c -o /tmp/q2-framework-ubsan
          /tmp/q2-framework-ubsan

  mips:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MIPS toolchain and Unicorn
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld binutils
          python3 -m pip install --break-system-packages unicorn==2.1.4
      - name: Run actual compiled MIPS arcade rules
        run: python3 test/arcade_mips.py --self-test

  firmware-games:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install host firmware test requirements
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm gcc-multilib
          python3 -m pip install --break-system-packages -r requirements.txt -r test/unit/requirements.txt
      - name: Compile firmware Games code for MIPS with strict shadow checks
        run: |
          PYTHONPATH=test/fw python3 -c 'from pathlib import Path; import host; host.headers(Path("/tmp/q2-arcade-headers"))'
          clang --target=mipsel-linux-gnu -march=mips32r2 -mabi=32 -mfp64 -mno-abicalls -fno-pic -G0 -ffreestanding -fno-builtin -fno-stack-protector -fno-unwind-tables -fno-asynchronous-unwind-tables -Oz -Wall -Wextra -Werror -Wno-unused-parameter -Wshadow -Wimplicit-int-conversion -Wconditional-uninitialized -Wmissing-variable-declarations -Wvla -Wundef -I /tmp/q2-arcade-headers -I patch -c patch/games.c -o /tmp/q2-arcade-games.o
      - name: Validate TagLib M4B assembler on MIPS LLVM
        run: |
          python3 -c 'import sys, struct; sys.path.insert(0, "tools"); from build import assemble; blob, _ = assemble("m4b_cover", 0x30000, "-DBASE=0x30000"); assert blob[44:48] == bytes((109, 52, 98, 0)) and (struct.unpack_from("<I", blob, 16)[0] & 0xffff) == 0xd84c'
      - name: Run firmware's real game code under mocked host services
        run: python3 -m pytest test/fw/test_games.py -q
